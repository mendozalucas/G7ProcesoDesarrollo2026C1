server:
  port: 8080

spring:
  application:
    name: escrims
  datasource:
    url: jdbc:h2:file:./data/escrims;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

escrims:
  scheduler:
    delay-ms: 60000
  seed:
    enabled: true
  matchmaking:
    strategy: BY_MMR
    diferencia-mmr-maxima: 200
    latencia-maxima-ms: 80
    peso-mmr: 0.4
    peso-latencia: 0.3
    peso-historial: 0.3

logging:
  level:
    com.escrims: INFO
